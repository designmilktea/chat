name: Publish chat website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript and JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build React website
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/chat-preview.log 2>&1 &
          curl --retry 15 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4173/chat/ > /dev/null
          BASE_URL=http://127.0.0.1:4173/chat/ npm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-browser-evidence
          include-hidden-files: true
          path: .test-artifacts/
          if-no-files-found: ignore
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
